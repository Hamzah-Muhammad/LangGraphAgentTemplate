[project]
name = "langgraph-agent-template"
version = "0.1.0"
description = "Plug-and-play Python agent shell on LangChain 1.x + LangGraph 1.x, one file per building block"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-mcp-adapters>=0.3,<1",
    "python-dotenv>=1.0",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "langgraph-cli[inmem]>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "agents*", "tools*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
